<!doctype html>
<html lang="%LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%PAGE_URL%" />
    %ALTERNATES%
    <link rel="manifest" href="%MANIFEST%" />
    <!-- The first page and its titles paint first; the catalog and ingredient names follow at low priority. -->
    <link rel="preload" href="/data/first.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/data/overlay/%LANG%.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/data/catalog.json" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <link rel="preload" href="/data/lookup/%LANG%.json" as="fetch" crossorigin="anonymous" fetchpriority="low" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vegdex" />
    <meta property="og:locale" content="%OG_LOCALE%" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%PAGE_URL%" />
    <meta property="og:image" content="%SHARE_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%SHARE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "vegdex",
        "url": "%PAGE_URL%",
        "inLanguage": "%LANG%"
      }
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121211" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // A page's bare address opens the language the cook last picked; links with filters or a recipe open as written (ADR 0002).
      try {
        var lang = localStorage.getItem('vegdex:language'), paths = %LOCALE_PATHS%
        if (lang && paths[lang] && lang !== document.documentElement.lang && !location.search && location.pathname === paths[document.documentElement.lang])
          location.replace(paths[lang] + location.hash)
      } catch (e) {}
    </script>
    <script>
      // Before first paint, so a night-mode choice never flashes light. Mirrors lib/theme.svelte.ts.
      try {
        var t = localStorage.getItem('vegdex:theme')
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <title>%TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
