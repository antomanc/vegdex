<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Find vegan recipes from all-vegan food blogs. Filter by ingredients, meal and cooking time, then visit the original creator for the recipe." />
    <link rel="canonical" href="https://vegdex.antomanc.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vegdex" />
    <meta property="og:title" content="vegdex: find vegan recipes by ingredient and time" />
    <meta property="og:description" content="Find vegan recipes from all-vegan food blogs. Filter by ingredients, meal and cooking time, then visit the original creator for the recipe." />
    <meta property="og:url" content="https://vegdex.antomanc.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "vegdex",
        "url": "https://vegdex.antomanc.com/",
        "inLanguage": "en"
      }
    </script>
    <meta name="theme-color" content="#1d4a31" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Before first paint, so a night-mode choice never flashes light. Mirrors lib/theme.svelte.ts.
      try {
        var t = localStorage.getItem('vegdex:theme')
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <title>vegdex: find vegan recipes by ingredient and time</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
