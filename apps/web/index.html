<!doctype html>
<html lang="%LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%PAGE_URL%" />
    %ALTERNATES%
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vegdex" />
    <meta property="og:locale" content="%OG_LOCALE%" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:url" content="%PAGE_URL%" />
    <meta property="og:image" content="%SITE_URL%icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "vegdex",
        "url": "%PAGE_URL%",
        "inLanguage": "%LANG%"
      }
    </script>
    <meta name="theme-color" content="#1d4a31" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Before first paint, so a night-mode choice never flashes light. Mirrors lib/theme.svelte.ts.
      try {
        var t = localStorage.getItem('vegdex:theme')
        document.documentElement.dataset.theme =
          t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <title>%TITLE%</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
