name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A rule removed or loosened, a ceiling raised, the verify command or a protected config changed since the
  # base branch fails here unless the PR's last commit carries a "Wellkept-Change: <reason>" trailer.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR's own head rather than the merge commit, so the trailer of its last commit is read.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: git fetch --no-tags origin "$BASE"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
      - run: node scripts/wellkept-check.mjs --against "$(git merge-base HEAD "origin/$BASE")"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight
      - run: node scripts/verify.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
